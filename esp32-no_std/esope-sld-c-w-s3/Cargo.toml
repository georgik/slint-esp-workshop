[package]
name = "slint-workshop-esp-esope"
version = "0.2.0"
authors = ["Michael Winkelmann <michael@winkelmann.site>"]
edition = "2024"
rust-version = "1.85"

[dependencies]
log = { version = "0.4", default-features = false }

    #path = "../../../../slint/api/rs/slint", 
slint = { version = "1.14.1", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

# ESoPE board specific dependencies
display-interface = "0.5.0"
embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4"
embedded-graphics-framebuf = "0.5.0"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.2"
mipidsi = "0.9.0"
eeprom24x = "0.7.2"
esp-println = { version = "0.15.0", features = ["esp32s3", "log-04"] }

# Updated to match workshop versions
critical-section = "1.2.0"
embassy-executor = "0.9.0"
embassy-time = "0.5.0"
embassy-sync = { version = "0.7.0", default-features = false }
static_cell = "2.1.0"
esp-radio = { version = "0.17.0", features = ["esp32s3", "wifi", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram"] }
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.17.0", features = ["esp32s3", "exception-handler", "println"] }
heapless = { version = "0.8.0", default-features = false }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
sitronix-touch = "0.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[build-dependencies]
slint-build = { version = "1.14.1", features = ["sdf-fonts"] }
#slint-build = { path = "../../../../slint/api/rs/build", features = ["sdf-fonts"] }
