[package]
name = "slint-workshop-esp-esp32-s3-box-3"
version = "0.2.0"
authors = ["Michael Winkelmann <michael@winkelmann.site>"]
edition = "2024"
rust-version = "1.88"

[dependencies]
log = { version = "0.4", default-features = false }

slint = { version = "1.15.1", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

# ESP32-S3-Box-3 display and touch dependencies  
embedded-graphics = "0.8.2"
embedded-graphics-core = "0.4"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3"
mipidsi = "0.9.0"
display-interface = "0.5.0"
esp-println = { version = "0.15.0", features = ["esp32s3", "log-04"] }

# Updated to match workshop versions with WiFi support
critical-section = "1.2.0"
embassy-executor = { version = "0.9.1", features = ["executor-thread"] }
embassy-time = "0.5.1"
embassy-sync = { version = "0.7.2", default-features = false }
static_cell = "2.1.1"
esp-radio = { version = "0.17.0", features = ["esp32s3", "wifi"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable", "psram"] }
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.17.0", features = ["esp32s3", "println"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
heapless = { version = "0.9.2", default-features = false }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
smoltcp = { version = "0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }

# Touch controller support for ESP32-S3-Box-3 GT911
gt911 = "0.3.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[build-dependencies]
slint-build = { version = "1.15.1", features = ["sdf-fonts"] }
